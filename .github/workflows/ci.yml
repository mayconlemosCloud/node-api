name: CI Pipeline

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Set up Docker Compose
        run: sudo apt-get install docker-compose

      - name: Build and start services
        run: docker-compose up --build -d

      - name: Build project
        run: docker-compose exec -T app npm run build

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Set up Docker Compose
        run: sudo apt-get install docker-compose

      - name: Start services
        run: docker-compose up -d

      - name: Run unit tests
        run: docker-compose exec -T app npm test

  cypress:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Set up Docker Compose
        run: sudo apt-get install docker-compose

      - name: Start services
        run: docker-compose up -d

      - name: Run Cypress tests
        run: docker-compose exec -T app npm run cypress:run

  create-pr:
    runs-on: ubuntu-latest
    needs: cypress
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v3
        with:
          branch: main
          title: 'Automated PR from CI Pipeline'
          body: 'This PR was created automatically by the CI pipeline.'
