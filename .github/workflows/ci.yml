name: CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  Build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Faz o checkout do código do repositório

      - name: Run Docker Compose with Tests
        uses: adambirds/docker-compose-action@v1.5.0 # Usa o Docker Compose para subir os serviços e executar os testes
        with:
          compose-file: "./docker-compose.yml"
          up-flags: "--build"
          down-flags: "--volumes"
          test-container: "app"
          test-command: "npm run test"

  create_release:
    runs-on: ubuntu-latest
    needs: Build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Faz o checkout do código do repositório

      - name: Create Release Branch and PR
        if: ${{ success() }}
        uses: peter-evans/create-pull-request@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: release
          commit-message: "Create release branch"
          title: "Create release branch"
          body: "This PR creates a new release branch."
